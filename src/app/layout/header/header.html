<header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <a routerLink="/flights" class="flex items-center gap-2">
        <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-600 to-sky-500 text-white font-black">
          TA
        </div>
        <div class="leading-tight">
          <div class="text-sm font-extrabold tracking-tight text-slate-900">TrampsAviation</div>
          <div class="text-xs text-slate-500 -mt-0.5">Flights • Hotels</div>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1 rounded-2xl bg-slate-50 p-1 ring-1 ring-slate-200">
        <a routerLink="/flights" routerLinkActive="bg-white text-slate-900 shadow-sm"
           class="px-4 py-2 text-sm font-semibold rounded-2xl text-slate-600 hover:text-slate-900">
          Flights
        </a>
        <a routerLink="/hotels" routerLinkActive="bg-white text-slate-900 shadow-sm"
           class="px-4 py-2 text-sm font-semibold rounded-2xl text-slate-600 hover:text-slate-900">
          Hotels
        </a>
      </nav>

      <div class="flex items-center gap-2">
        <ng-container *ngIf="auth.isLoggedIn(); else loggedOut">
          <div class="hidden sm:block text-sm text-slate-600">
            {{ auth.user?.email }}
          </div>
          <button (click)="logout()"
                  class="rounded-xl px-4 py-2 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800">
            Logout
          </button>
        </ng-container>

        <ng-template #loggedOut>
          <a routerLink="/login"
             class="rounded-xl px-4 py-2 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800">
            Login
          </a>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="md:hidden border-t border-slate-200/70 bg-white">
    <div class="mx-auto max-w-7xl px-4 py-2 flex gap-2">
      <a routerLink="/flights" routerLinkActive="bg-slate-900 text-white"
         class="flex-1 text-center rounded-xl py-2 text-sm font-semibold bg-slate-50 text-slate-700">
        Flights
      </a>
      <a routerLink="/hotels" routerLinkActive="bg-slate-900 text-white"
         class="flex-1 text-center rounded-xl py-2 text-sm font-semibold bg-slate-50 text-slate-700">
        Hotels
      </a>
    </div>
  </div>
</header>
