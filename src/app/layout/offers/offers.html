<div class="mt-6">
    <div class="flex items-center justify-between gap-4">
        <div>
            <div class="text-lg font-extrabold text-slate-900">Offers for you</div>
            <div class="text-sm text-slate-600">
                {{ mode === 'hotels' ? 'Hotel deals & coupons' : 'Flight deals & coupons' }}
            </div>
        </div>

        <span class="hidden sm:inline text-xs font-semibold text-slate-500">
            Demo offers (real APIs later)
        </span>
    </div>

    <div class="mt-4 flex gap-4 overflow-x-auto pb-2 offers-scroll">
        <div *ngFor="let o of offers"
            class="min-w-[300px] sm:min-w-[360px] rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md transition">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <div class="text-base font-extrabold text-slate-900">{{ o.title }}</div>
                    <div class="mt-1 text-sm text-slate-600">{{ o.subtitle }}</div>
                </div>

                <span class="shrink-0 rounded-full bg-slate-900 px-3 py-1 text-xs font-bold text-white">
                    {{ o.badge }}
                </span>
            </div>

            <div class="mt-4 flex items-center justify-between gap-3">
                <div class="rounded-xl bg-slate-50 px-3 py-2 w-full border border-slate-200">
                    <div class="text-[11px] text-slate-500 font-semibold">Coupon</div>
                    <div class="font-extrabold text-slate-900 tracking-wide">{{ o.code }}</div>
                </div>

                <button (click)="copy(o.code)"
                    class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-bold text-white hover:bg-slate-800"
                    title="Copy code">
                    Copy
                </button>
            </div>

            <div class="mt-3 flex items-center justify-between">
                <div class="text-xs font-semibold text-slate-500">{{ o.expiresIn }}</div>
                <button class="text-sm font-extrabold text-indigo-700 hover:text-indigo-800" type="button">
                    {{ o.cta }} →
                </button>
            </div>
        </div>
    </div>
</div>
