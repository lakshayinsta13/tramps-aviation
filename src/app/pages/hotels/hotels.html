<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
  <div class="rounded-3xl bg-gradient-to-br from-sky-700 to-indigo-700 p-6 sm:p-10 text-white shadow-lg">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Search Hotels</h1>
    <p class="mt-2 text-white/80 text-sm sm:text-base">
      Search is free. Login required to book.
    </p>

    <div class="mt-6 rounded-2xl bg-white/10 ring-1 ring-white/15 p-4 sm:p-5">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
        <div class="lg:col-span-2">
          <label class="text-xs font-semibold text-white/80">City</label>
          <input [(ngModel)]="city" placeholder="Shimla / Delhi / Mumbai"
                 class="mt-1 w-full rounded-xl bg-white/90 px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-white/40" />
        </div>

        <div>
          <label class="text-xs font-semibold text-white/80">Check-in</label>
          <input [(ngModel)]="checkIn" type="date"
                 class="mt-1 w-full rounded-xl bg-white/90 px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-white/40" />
        </div>

        <div>
          <label class="text-xs font-semibold text-white/80">Check-out</label>
          <input [(ngModel)]="checkOut" type="date"
                 class="mt-1 w-full rounded-xl bg-white/90 px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-white/40" />
        </div>

        <div class="flex items-end">
          <button (click)="onSearch()"
                  class="w-full rounded-xl bg-white px-4 py-2.5 font-bold text-slate-900 hover:bg-slate-100 shadow-sm">
            Search
          </button>
        </div>
      </div>

      <div *ngIf="error" class="mt-3 text-sm font-semibold text-rose-100">
        {{ error }}
      </div>
    </div>
  </div>

  <div class="mt-8" *ngIf="searched">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <div class="text-lg font-extrabold text-slate-900">Results</div>
        <div class="text-sm text-slate-600">
          {{ city }} • {{ nights }} night(s)
        </div>
      </div>

      <select [(ngModel)]="sort" (ngModelChange)="applySort()"
              class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700">
        <option value="price">Sort: Price</option>
        <option value="rating">Sort: Rating</option>
      </select>
    </div>

    <div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div *ngFor="let h of results"
           class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md transition">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-base font-extrabold text-slate-900">{{ h.name }}</div>
            <div class="mt-1 text-sm text-slate-600">{{ h.area }}</div>
          </div>

          <div class="rounded-xl bg-slate-900 px-3 py-1 text-xs font-bold text-white">
            ★ {{ h.rating.toFixed(1) }}
          </div>
        </div>

        <div class="mt-3 flex flex-wrap gap-2">
          <span *ngFor="let p of h.perks"
                class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">
            {{ p }}
          </span>
        </div>

        <div class="mt-4 flex items-end justify-between">
          <div>
            <div class="text-xs text-slate-500">From</div>
            <div class="text-xl font-extrabold text-slate-900">₹{{ h.pricePerNight }}</div>
            <div class="text-xs text-slate-500">per night (demo)</div>
          </div>

          <button (click)="book(h)"
                  class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-bold text-white hover:bg-slate-800">
            Book
          </button>
        </div>

        <div class="mt-3 text-xs text-slate-500">
          Booking requires login. Taxes may apply with real APIs.
        </div>
      </div>
    </div>
  </div>
</div>
