<div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-extrabold text-slate-900">Flight Booking</h1>
      <p class="text-sm text-slate-600 mt-1">Complete traveller details and confirm booking.</p>
    </div>
    <a routerLink="/flights" class="text-sm font-semibold text-slate-900 hover:underline">Back</a>
  </div>

  <!-- Summary -->
  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
    <div class="font-bold text-slate-900">Trip summary</div>
    <div class="mt-2 text-sm text-slate-700">
      <div><span class="text-slate-500">Flight:</span> {{ flightId || 'Demo Flight' }}</div>
      <div><span class="text-slate-500">Route:</span> {{ from || '---' }} → {{ to || '---' }}</div>
      <div><span class="text-slate-500">Date:</span> {{ date || '---' }}</div>
    </div>
  </div>

  <!-- Passenger -->
  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
    <div class="flex items-center justify-between">
      <div class="font-bold text-slate-900">Passenger details</div>
      <button (click)="addPassenger()" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold hover:bg-slate-50">
        + Add passenger
      </button>
    </div>

    <div class="mt-4 grid gap-4">
      <div *ngFor="let p of pax; let i = index" class="rounded-2xl border border-slate-200 p-4">
        <div class="flex items-center justify-between">
          <div class="font-semibold text-slate-900">Passenger {{ i + 1 }}</div>
          <button (click)="removePassenger(i)" class="text-sm font-semibold text-rose-600 hover:underline">Remove</button>
        </div>

        <div class="mt-3 grid grid-cols-1 sm:grid-cols-4 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-700">Title</label>
            <select [(ngModel)]="p.title" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2">
              <option>Mr</option>
              <option>Ms</option>
              <option>Mrs</option>
            </select>
          </div>
          <div class="sm:col-span-1">
            <label class="text-xs font-semibold text-slate-700">First name</label>
            <input [(ngModel)]="p.firstName" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="First name" />
          </div>
          <div class="sm:col-span-1">
            <label class="text-xs font-semibold text-slate-700">Last name</label>
            <input [(ngModel)]="p.lastName" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="Last name" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-700">DOB (optional)</label>
            <input [(ngModel)]="p.dob" type="date" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact -->
  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
    <div class="font-bold text-slate-900">Contact details</div>
    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-700">Email</label>
        <input [(ngModel)]="email" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="you@example.com" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-700">Mobile (10 digits)</label>
        <input [(ngModel)]="phone" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="9876543210" />
      </div>
    </div>
  </div>

  <!-- Terms -->
  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
    <label class="flex items-start gap-3">
      <input type="checkbox" [(ngModel)]="accept" class="mt-1" />
      <span class="text-sm text-slate-700">
        I agree to
        <a routerLink="/terms" class="font-semibold text-slate-900 hover:underline">Terms & Conditions</a>,
        <a routerLink="/privacy" class="font-semibold text-slate-900 hover:underline">Privacy Policy</a> and
        <a routerLink="/refund-policy" class="font-semibold text-slate-900 hover:underline">Refund Policy</a>.
      </span>
    </label>

    <div *ngIf="error" class="mt-3 text-sm font-semibold text-rose-600">
      {{ error }}
    </div>

    <div class="mt-4 flex justify-end">
      <button (click)="confirm()"
        class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-bold text-white hover:bg-slate-800">
        Confirm booking
      </button>
    </div>
  </div>
</div>
