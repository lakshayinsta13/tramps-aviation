<div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 py-10">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="text-2xl font-extrabold text-slate-900">Booking confirmed (Demo)</div>
    <p class="mt-2 text-slate-600 text-sm">This is a demo confirmation. Real PNR/booking id will come from APIs.</p>

    <div *ngIf="data; else noData" class="mt-6 space-y-4">
      <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
        <div class="text-sm text-slate-600">Booking ID</div>
        <div class="text-xl font-extrabold text-slate-900">{{ data.bookingId }}</div>
      </div>

      <div class="rounded-2xl border border-slate-200 p-4">
        <div class="font-bold text-slate-900">Summary</div>
        <pre class="mt-2 text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 overflow-auto">{{ data | json }}</pre>
      </div>

      <div class="flex gap-2 justify-end">
        <a routerLink="/flights" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold hover:bg-slate-50">Book Flights</a>
        <a routerLink="/hotels" class="rounded-xl bg-slate-900 text-white px-4 py-2 text-sm font-bold hover:bg-slate-800">Book Hotels</a>
      </div>
    </div>

    <ng-template #noData>
      <div class="mt-6 text-slate-600">No booking data found. Please search and book again.</div>
      <div class="mt-4">
        <a routerLink="/flights" class="text-sm font-semibold text-slate-900 hover:underline">Go to Flights</a>
      </div>
    </ng-template>
  </div>
</div>
