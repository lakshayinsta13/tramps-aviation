<div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-900">Hotel Booking</h1>
            <p class="text-sm text-slate-600 mt-1">Enter guest details and confirm booking.</p>
        </div>
        <a routerLink="/hotels" class="text-sm font-semibold text-slate-900 hover:underline">Back</a>
    </div>

    <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
        <div class="font-bold text-slate-900">Stay summary</div>
        <div class="mt-2 text-sm text-slate-700">
            <div><span class="text-slate-500">Hotel:</span> {{ hotelId || 'Demo Hotel' }}</div>
            <div><span class="text-slate-500">City:</span> {{ city || '---' }}</div>
            <div><span class="text-slate-500">Check-in:</span> {{ checkIn || '---' }}</div>
            <div><span class="text-slate-500">Check-out:</span> {{ checkOut || '---' }}</div>
        </div>
    </div>

    <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
        <div class="font-bold text-slate-900">Guest details</div>

        <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
                <label class="text-xs font-semibold text-slate-700">Full name</label>
                <input [(ngModel)]="fullName" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"
                    placeholder="Full name" />
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700">Email</label>
                <input [(ngModel)]="email" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"
                    placeholder="you@example.com" />
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700">Mobile (10 digits)</label>
                <input [(ngModel)]="phone" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"
                    placeholder="9876543210" />
            </div>

            <div class="sm:col-span-2">
                <label class="text-xs font-semibold text-slate-700">Special request (optional)</label>
                <textarea [(ngModel)]="specialRequest" rows="3"
                    class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"
                    placeholder="Late check-in / extra pillow / etc"></textarea>
            </div>
        </div>
    </div>

    <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
        <label class="flex items-start gap-3">
            <input type="checkbox" [(ngModel)]="accept" class="mt-1" />
            <span class="text-sm text-slate-700">
                I agree to
                <a routerLink="/terms" class="font-semibold text-slate-900 hover:underline">Terms & Conditions</a>,
                <a routerLink="/privacy" class="font-semibold text-slate-900 hover:underline">Privacy Policy</a> and
                <a routerLink="/refund-policy" class="font-semibold text-slate-900 hover:underline">Refund Policy</a>.
            </span>
        </label>

        <div *ngIf="error" class="mt-3 text-sm font-semibold text-rose-600">
            {{ error }}
        </div>

        <div class="mt-4 flex justify-end">
            <button (click)="confirm()"
                class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-bold text-white hover:bg-slate-800">
                Confirm booking
            </button>
        </div>
    </div>
</div>
